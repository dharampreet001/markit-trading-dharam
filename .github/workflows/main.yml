name: 🚀 Live 4-Tier Strategy Market Scanner

on:
  schedule:
    # Runs Monday to Friday at 03:40 AM UTC (09:10 AM IST)
    - cron: '40 3 * * 1-5'
  workflow_dispatch:
    inputs:
      test_run:
        description: 'Run single test scan cycle (Ignore market hours check)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  run-live-scanner:
    name: ⚡ 4-Tier F&O Market Scanner
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 📦 Install Required Packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Start 4-Tier Live Institutional Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_RUN: ${{ github.event.inputs.test_run || 'false' }}
          PYTHONUNBUFFERED: "1"
        run: |
          python live_clean_alert_scanner.py  
